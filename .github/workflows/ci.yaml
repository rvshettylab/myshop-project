#CI for product-catalog service
name: product-catalog-ci

on: 
    pull_request:
        branches:
        - main

jobs:
    build: 
        runs-on: ubuntu-latest
        steps:
            - name: checkout code
              uses: actions/checkout@v4
            
            - name: Set Go 1.22
              uses: actions/setup-go@v4
              with:
                go-version: 1.22
            
            - name: Build
              run : |
                cd product-catalog
                go mod download
                go build -o product-catalog-service main.go

            - name: unit test
              run: |
                cd product-catalog
                go test ./...

    code-quality:
        runs-on: ununtu-latest

        steps:
            - name: checkout code
              uses: actions/checkout@v4

            - name: Run golang-lint
              run: 
                go install github.com/golangci/golangci-lint/cmd/golangci-lint@1.56.2
                golangci-lint run ./product-catalog/...

    docker: 
        runs-on: ubuntu-latest

        needs: build
        
        steps:
            - name: checkout code
              uses: actions/checkout@v4

            - name: Install Docker
              uses: docker/setup-buildx-action@v1

            - name: login to docker hub
              uses: docker/login-action@v2
              with:
                username: ${{ secrets.DOCKER_USERNAME }}
                password: ${{ secrets.DOCKER_TOKEN }}
            - name: Docker push
              uses: docker/build-push-action@v6
              with:
                context: ./product-catalog
                file: ./product-catalog/Dockerfile
                push: true
                tags: ${{ secrets.DOCKER_USERNAME }}/product-catalog:${{ github.run_id }}

    update-k8s-deployment:
        runs-on: ubuntu-latest

        needs: docker

        steps:
            - name: checkout code
              uses: actions/checkout@v4
              with:
                user-token: ${{ secrets.GITHUB_TOKEN }}

            - name: update tag in kubernetes deployment manifest
              run: |
                sed -i "s|image: .*|image: ${{ secrets.DOCKER_USERNAME }}/product-catalog:${{ github.run_id }}|" kubernetes/product-catalog/deploy.yaml
          
            - name: Commit and push changes
              run: |
                git config --global user.name "raviraj"
                git config --global user.email "rvshetty1711@gmail.com"
                git add ./kubernetes/product-catalog/deploy.yaml
                git commit -m "Update product-catalog image tag to ${{ github.run_id }}"
                git push origin main